<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street 3x3 — Administración</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<style>
:root{
  --lime:#B6FF00;
  --black:#0B0B0B;
  --panel:#151515;
  --border:#333;
  --white:#fff;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--black);
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  background:#111;
  border-bottom:2px solid var(--lime);
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:1000;
}

.logo span{
  color:var(--lime);
}

button{
  border:1px solid #444;
  background:#222;
  color:white;
  padding:11px 16px;
  border-radius:8px;
  font-weight:800;
  cursor:pointer;
}

button:hover{
  border-color:var(--lime);
  color:var(--lime);
}

.primary{
  background:var(--lime);
  color:#000;
  border-color:var(--lime);
}

.danger{
  border-color:#ff4444;
  color:#ff7777;
}

main{
  max-width:1200px;
  margin:auto;
  padding:25px;
}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:22px;
  margin-bottom:20px;
}

h2{
  margin-top:0;
}

input,select{
  background:#202020;
  border:1px solid #444;
  color:white;
  border-radius:7px;
  padding:11px;
}

input:focus,select:focus{
  outline:none;
  border-color:var(--lime);
}

.login{
  max-width:450px;
  margin:100px auto;
}

.login input{
  width:100%;
  margin-bottom:12px;
}

.login button{
  width:100%;
}

.hidden{
  display:none!important;
}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.tab{
  padding:12px 18px;
}

.tab.active{
  background:var(--lime);
  color:#000;
  border-color:var(--lime);
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.team-form{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.team-list{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.team{
  background:#202020;
  border:1px solid #333;
  border-radius:10px;
  padding:15px;
}

.team strong{
  display:block;
  font-size:18px;
}

.team small{
  color:#aaa;
}

.fixture{
  width:100%;
  border-collapse:collapse;
}

.fixture th,
.fixture td{
  border-bottom:1px solid #333;
  padding:12px;
  text-align:left;
}

.fixture th{
  color:var(--lime);
}

.result{
  width:60px;
  text-align:center;
}

.group-title{
  color:var(--lime);
  margin-top:25px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #333;
  text-align:center;
}

th{
  color:var(--lime);
}

td:nth-child(2){
  text-align:left;
}

.playoff{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.round{
  background:#151515;
  border:1px solid #333;
  border-radius:12px;
  padding:15px;
}

.round h3{
  color:var(--lime);
  text-align:center;
}

.match{
  background:#202020;
  border-radius:8px;
  padding:12px;
  margin-bottom:12px;
}

.match div{
  padding:5px;
}

#app{
  display:none;
}

@media(max-width:800px){
  .team-list{
    grid-template-columns:1fr 1fr;
  }

  .playoff{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div id="login" class="login panel">

<h1>STREET 3x3</h1>
<h2>Administrador</h2>

<input id="email" type="email" placeholder="Correo electrónico">

<input id="password" type="password" placeholder="Contraseña">

<button class="primary" onclick="login()">INGRESAR</button>

<p id="loginError"></p>

</div>


<div id="app">

<header>

<div class="logo">
<span>STREET</span> 3x3 — ADMIN
</div>

<button onclick="logout()">Cerrar sesión</button>

</header>


<main>

<div class="tabs">

<button class="tab active" onclick="showTab('equipos',this)">
EQUIPOS
</button>

<button class="tab" onclick="showTab('fixture',this)">
FIXTURE
</button>

<button class="tab" onclick="showTab('resultados',this)">
RESULTADOS
</button>

<button class="tab" onclick="showTab('tablas',this)">
TABLAS
</button>

<button class="tab" onclick="showTab('playoffs',this)">
PLAYOFFS
</button>

</div>


<!-- EQUIPOS -->

<section id="equipos" class="section active">

<div class="panel">

<h2>Agregar equipos</h2>

<div class="team-form">

<input id="teamName" placeholder="Nombre del equipo">

<select id="teamGroup">

<option value="A">Grupo A</option>
<option value="B">Grupo B</option>
<option value="C">Grupo C</option>
<option value="D">Grupo D</option>

</select>

<button class="primary" onclick="addTeam()">
AGREGAR EQUIPO
</button>

</div>

<div id="teamList" class="team-list"></div>
<br>

<div class="panel">

<h2>Agregar participantes</h2>

<div class="team-form">

<input
id="participantName"
type="text"
placeholder="Nombre del participante">

<select id="participantTeam">

<option value="">Seleccionar equipo</option>

</select>

<input
id="participantNumber"
type="number"
placeholder="Número"
min="0"
max="99">

<button
class="primary"
onclick="addParticipant()">
AGREGAR PARTICIPANTE
</button>

</div>

<div
id="participantList"
class="team-list">
</div>

</div>
</div>

</section>


<!-- FIXTURE -->

<section id="fixture" class="section">

<div class="panel">

<h2>Fixture</h2>

<button class="primary" onclick="generateFixture()">
GENERAR FIXTURE
</button>

<p>
Esto genera los 24 partidos de la fase de grupos.
</p>

<div id="fixtureList"></div>

</div>

</section>


<!-- RESULTADOS -->

<section id="resultados" class="section">

<div class="panel">

<h2>Cargar resultados</h2>

<div id="resultsList"></div>

</div>

</section>


<!-- TABLAS -->

<section id="tablas" class="section">

<div class="panel">

<h2>Tablas de posiciones</h2>

<div id="tables"></div>

</div>

</section>


<!-- PLAYOFFS -->

<section id="playoffs" class="section">

<div class="panel">

<h2>Playoffs</h2>

<button class="primary" onclick="generatePlayoffs()">
GENERAR PLAYOFFS
</button>

<div id="playoffBoard"></div>

</div>

</section>

</main>

</div>


<script>

// Import the functions you need from the SDKs you need

// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDYfJ4qQSVqBWLBu5DziwtkWWXB4ycnSSw",
  authDomain: "street-3x3.firebaseapp.com",
  databaseURL: "https://street-3x3-default-rtdb.firebaseio.com",
  projectId: "street-3x3",
  storageBucket: "street-3x3.firebasestorage.app",
  messagingSenderId: "829695563143",
  appId: "1:829695563143:web:cccf22e2fe50f72d592f22",
  measurementId: "G-HYRY8Z1ZGF"
};


firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.database();

const tournamentRef=db.ref("tournament");

let data={
teams:{},
matches:{},
playoffs:{}
};


/* LOGIN */

function login(){

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

auth.signInWithEmailAndPassword(email,password)
.catch(error=>{
document.getElementById("loginError").textContent=
"Error: "+error.message;
});

}

function logout(){
auth.signOut();
}

auth.onAuthStateChanged(user=>{

if(user){

document.getElementById("login").classList.add("hidden");
document.getElementById("app").style.display="block";

loadData();

}else{

document.getElementById("login").classList.remove("hidden");
document.getElementById("app").style.display="none";

}

});


/* FIREBASE */

function loadData(){

tournamentRef.on("value",snap=>{

const value=snap.val();

if(value && typeof value === "object" && !Array.isArray(value)){

data=value;

if(!data.teams || typeof data.teams !== "object"){
data.teams={};
}

if(!data.matches || typeof data.matches !== "object"){
data.matches={};
}

if(!data.playoffs || typeof data.playoffs !== "object"){
data.playoffs={};
}

}else{

data={
teams:{},
matches:{},
playoffs:{}
};

}

renderTeams();
renderFixture();
renderResults();
renderTables();
renderPlayoffs();

});

}


/* TABS */

function showTab(id,button){

document.querySelectorAll(".section")
.forEach(x=>x.classList.remove("active"));

document.querySelectorAll(".tab")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

button.classList.add("active");

}


/* EQUIPOS */

function addTeam(){

const name=document.getElementById("teamName").value.trim();
const group=document.getElementById("teamGroup").value;

if(!name){
alert("Escribí el nombre del equipo.");
return;
}

const id="team_"+Date.now();

data.teams[id]={
name:name,
group:group
};

save();

document.getElementById("teamName").value="";

}

function deleteTeam(id){

if(!confirm("¿Eliminar este equipo?")) return;

delete data.teams[id];

save();

}

function renderTeams(){

const container=document.getElementById("teamList");

container.innerHTML="";

const groups=["A","B","C","D"];

groups.forEach(group=>{

Object.entries(data.teams||{})
.filter(([id,t])=>t.group===group)
.forEach(([id,t])=>{

const div=document.createElement("div");

div.className="team";

div.innerHTML=`
<strong>${escapeHtml(t.name)}</strong>
<small>Grupo ${group}</small>
<br><br>
<button class="danger"
onclick="deleteTeam('${id}')">
ELIMINAR
</button>
`;

container.appendChild(div);

});

});

}
  
/* PARTICIPANTES */

function ensureParticipants(){

if(!data.participants){
data.participants={};
}

}


function addParticipant(){

ensureParticipants();

const name=document.getElementById("participantName").value.trim();
const team=document.getElementById("participantTeam").value;
const number=document.getElementById("participantNumber").value.trim();

if(!name){
alert("Ingresá el nombre del participante.");
return;
}

if(!team){
alert("Seleccioná un equipo.");
return;
}

const id="player_"+Date.now();

data.participants[id]={

name:name,
team:team,
number:number,

points:0,
rebounds:0,
assists:0,
motm:0

};

save();

document.getElementById("participantName").value="";
document.getElementById("participantNumber").value="";

renderParticipants();

}


function deleteParticipant(id){

if(!confirm("¿Eliminar este participante?")) return;

ensureParticipants();

delete data.participants[id];

save();

renderParticipants();

}


function renderParticipants(){

ensureParticipants();

const container=document.getElementById("participantList");

if(!container)return;

container.innerHTML="";

const participants=Object.entries(data.participants);

if(!participants.length){

container.innerHTML="<p>No hay participantes cargados.</p>";

return;

}

participants.forEach(([id,p])=>{

const team=data.teams[p.team];

const div=document.createElement("div");

div.className="team";

div.innerHTML=`

<strong>${escapeHtml(p.name)}</strong>

<small>
${team ? escapeHtml(team.name) : "Equipo no encontrado"}
${p.number ? " · #"+escapeHtml(p.number) : ""}
</small>

<br><br>

<div>
PTS: ${p.points||0}
&nbsp; | &nbsp;
REB: ${p.rebounds||0}
&nbsp; | &nbsp;
AST: ${p.assists||0}
&nbsp; | &nbsp;
MOTM: ${p.motm||0}
</div>

<br>

<button
class="danger"
onclick="deleteParticipant('${id}')">
ELIMINAR
</button>

`;

container.appendChild(div);

});

}


function updateParticipantStats(id){

ensureParticipants();

const p=data.participants[id];

if(!p)return;

const points=prompt(
"Puntos de "+p.name,
p.points||0
);

if(points===null)return;

const rebounds=prompt(
"Rebotes de "+p.name,
p.rebounds||0
);

if(rebounds===null)return;

const assists=prompt(
"Asistencias de "+p.name,
p.assists||0
);

if(assists===null)return;

const motm=prompt(
"MOTM de "+p.name,
p.motm||0
);

if(motm===null)return;

p.points=Number(points)||0;
p.rebounds=Number(rebounds)||0;
p.assists=Number(assists)||0;
p.motm=Number(motm)||0;

save();

renderParticipants();

}

/* FIXTURE */

function generateFixture(){

const groups=["A","B","C","D"];

data.matches={};

groups.forEach(group=>{

const teams=Object.entries(data.teams)
.filter(([id,t])=>t.group===group)
.map(([id,t])=>({id,...t}));

if(teams.length!==4){

alert("El Grupo "+group+
" necesita exactamente 4 equipos.");

return;

}

let counter=0;

for(let i=0;i<4;i++){

for(let j=i+1;j<4;j++){

const id="match_"+group+"_"+counter++;

data.matches[id]={
group:group,
home:teams[i].id,
away:teams[j].id,
homeScore:null,
awayScore:null,
court:"",
time:"",
status:"Pendiente"
};
}

}

});

save();

alert("Fixture generado correctamente.");

}


/* FIXTURE VIEW */

function renderFixture(){

const container=document.getElementById("fixtureList");

if(!Object.keys(data.matches||{}).length){

container.innerHTML="<p>No hay fixture generado.</p>";
return;

}

let html="<table class='fixture'>";
html+=`
<tr>
<th>Grupo</th>
<th>Cancha</th>
<th>Hora</th>
<th>Local</th>
<th>Visitante</th>
<th>Resultado</th>
</tr>
`;

Object.entries(data.matches).forEach(([id,m])=>{

const h=data.teams[m.home];
const a=data.teams[m.away];

if(!h||!a)return;

html+=`
<tr>
<td>${m.group}</td>
<td>${m.court||"-"}</td>
<td>${m.time||"-"}</td>
<td>${escapeHtml(h.name)}</td>
<td>${escapeHtml(a.name)}</td>
<td>
${m.homeScore == null || m.awayScore == null
?"-"
:m.homeScore+" - "+m.awayScore}
</td>
</tr>
`;

});

html+="</table>";

container.innerHTML=html;

}


/* RESULTADOS */

function renderResults(){

const container=document.getElementById("resultsList");

if(!Object.keys(data.matches||{}).length){

container.innerHTML="<p>Primero generá el fixture.</p>";
return;

}

let html="";

Object.entries(data.matches).forEach(([id,m])=>{

const h=data.teams[m.home];
const a=data.teams[m.away];

if(!h||!a)return;

html+=`
<div class="panel">

<strong>
Grupo ${m.group} —
${escapeHtml(h.name)} vs ${escapeHtml(a.name)}
</strong>

<br><br>

<input
class="result"
type="number"
id="${id}_h"
value="${m.homeScore??""}"
placeholder="0">

-

<input
class="result"
type="number"
id="${id}_a"
value="${m.awayScore??""}"
placeholder="0">

<br><br>

<input
id="${id}_court"
placeholder="Cancha"
value="${m.court||""}">

<input
id="${id}_time"
placeholder="Hora"
value="${m.time||""}">

<button class="primary"
onclick="saveResult('${id}')">
GUARDAR
</button>

</div>
`;

});

container.innerHTML=html;

}


function saveResult(id){

const m=data.matches[id];

const hs=document.getElementById(id+"_h").value;
const as=document.getElementById(id+"_a").value;

m.homeScore=hs===""?null:Number(hs);
m.awayScore=as===""?null:Number(as);

m.court=document.getElementById(id+"_court").value;
m.time=document.getElementById(id+"_time").value;

m.status=
m.homeScore===null
?"Pendiente"
:"Finalizado";

save();

}


/* TABLAS */

function calculateTable(group){

const teams=Object.entries(data.teams)
.filter(([id,t])=>t.group===group)
.map(([id,t])=>({

id:id,
name:t.name,
pj:0,
pg:0,
pp:0,
pf:0,
pc:0,
pts:0

}));

const map={};

teams.forEach(t=>map[t.id]=t);

Object.values(data.matches||{}).forEach(m=>{

if(m.group!==group)return;

if(m.homeScore == null || m.awayScore == null)return;

const h=map[m.home];
const a=map[m.away];

if(!h||!a)return;

h.pj++;
a.pj++;

h.pf+=m.homeScore;
h.pc+=m.awayScore;

a.pf+=m.awayScore;
a.pc+=m.homeScore;

if(m.homeScore>m.awayScore){

h.pg++;
a.pp++;

h.pts+=2;
a.pts+=1;

}else if(m.homeScore<m.awayScore){

a.pg++;
h.pp++;

a.pts+=2;
h.pts+=1;

}

});

teams.sort((a,b)=>{

const diffA=a.pf-a.pc;
const diffB=b.pf-b.pc;

return b.pg-a.pg ||
       diffB-diffA ||
       b.pf-a.pf;

});

return teams;

}


function renderTables(){

const container=document.getElementById("tables");

let html="";

["A","B","C","D"].forEach(group=>{

const teams=calculateTable(group);

html+=`
<h3 class="group-title">GRUPO ${group}</h3>

<table>

<tr>
<th>#</th>
<th>Equipo</th>
<th>PJ</th>
<th>PG</th>
<th>PP</th>
<th>PF</th>
<th>PC</th>
<th>DIF</th>
<th>PTS</th>
</tr>
`;

teams.forEach((t,i)=>{

html+=`
<tr>
<td>${i+1}</td>
<td>${escapeHtml(t.name)}</td>
<td>${t.pj}</td>
<td>${t.pg}</td>
<td>${t.pp}</td>
<td>${t.pf}</td>
<td>${t.pc}</td>
<td>${t.pf-t.pc}</td>
<td>${t.pts}</td>
</tr>
`;

});

html+="</table>";

});

container.innerHTML=html;

}


/* PLAYOFFS */

function generatePlayoffs(){

const A=calculateTable("A");
const B=calculateTable("B");
const C=calculateTable("C");
const D=calculateTable("D");

if(
A.length!==4||
B.length!==4||
C.length!==4||
D.length!==4
){

alert("Cada grupo necesita 4 equipos.");
return;

}

data.playoffs={

qf1:{home:A[0].id,away:B[1].id,homeScore:null,awayScore:null},
qf2:{home:B[0].id,away:A[1].id,homeScore:null,awayScore:null},
qf3:{home:C[0].id,away:D[1].id,homeScore:null,awayScore:null},
qf4:{home:D[0].id,away:C[1].id,homeScore:null,awayScore:null}

};

save();

}


function renderPlayoffs(){

const container=document.getElementById("playoffBoard");

if(!data.playoffs||
!Object.keys(data.playoffs).length){

container.innerHTML=
"<p>Generá los playoffs cuando termine la fase de grupos.</p>";

return;

}

const names=id=>
data.teams[id]?.name||"Por definir";

let html=`

<div class="playoff">

<div class="round">

<h3>CUARTOS</h3>

${playoffMatch(data.playoffs.qf1,"QF1")}
${playoffMatch(data.playoffs.qf2,"QF2")}
${playoffMatch(data.playoffs.qf3,"QF3")}
${playoffMatch(data.playoffs.qf4,"QF4")}

</div>

<div class="round">

<h3>SEMIFINALES</h3>

<div class="match">Ganador QF1<br>vs<br>Ganador QF3</div>

<div class="match">Ganador QF2<br>vs<br>Ganador QF4</div>

</div>

<div class="round">

<h3>FINAL</h3>

<div class="match">

Ganador semifinal 1

<br><br>

vs

<br><br>

Ganador semifinal 2

</div>

</div>

<div class="round">

<h3>CAMPEÓN</h3>

<div class="match">

🏆 POR DEFINIR

</div>

</div>

</div>
`;

container.innerHTML=html;

}


function playoffMatch(m,label){

if(!m)return"";

return`
<div class="match">

<strong>${label}</strong>

<div>${escapeHtml(data.teams[m.home]?.name||"Por definir")}</div>

<div>vs</div>

<div>${escapeHtml(data.teams[m.away]?.name||"Por definir")}</div>

</div>
`;

}


/* SAVE */

function save(){

tournamentRef.set(data);

}


/* SEGURIDAD HTML */

function escapeHtml(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>
</html>
