<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STREET 3x3 — Transmisión</title>
<style>:root{--l:#B6FF00;--b:#0B0B0B;--w:#fff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.board{position:absolute;top:28px;left:50%;transform:translateX(-50%);width:min(1500px,96vw);background:rgba(11,11,11,.95);border:2px solid var(--l);border-radius:18px;padding:12px 25px}.top{display:flex;justify-content:center;align-items:center}.top img{width:90px;height:70px;object-fit:contain}.scores{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:25px}.team{text-align:center;font-size:clamp(24px,3vw,48px);font-weight:1000;text-transform:uppercase}.score{font-size:clamp(80px,11vw,170px);line-height:.85;color:var(--l);font-weight:1000;font-variant-numeric:tabular-nums}.clock{font-size:clamp(45px,6vw,90px);font-weight:1000;font-variant-numeric:tabular-nums}.fouls{font-size:16px;margin-top:10px}.dot{display:inline-block;width:13px;height:13px;border:2px solid white;margin:2px}.on{background:var(--l);border-color:var(--l)}@media(max-width:700px){.board{padding:8px 12px}.scores{gap:8px}.team{font-size:17px}.score{font-size:70px}.clock{font-size:42px}.top img{width:65px;height:52px}}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script>const firebaseConfig = {
  apiKey: "AIzaSyA0IEk-UXbRP3ZxAKtj8xiQZIYQH3L2roI",
  authDomain: "street-3x3.firebaseapp.com",
  databaseURL: "https://street-3x3-default-rtdb.firebaseio.com",
  projectId: "street-3x3",
  storageBucket: "street-3x3.firebasestorage.app",
  messagingSenderId: "829695563143",
  appId: "1:829695563143:web:52424caaf4ade069592f22",
  measurementId: "G-GYYX66VMFV"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const ref=db.ref("match");let state={home:0,away:0,homeF:0,awayF:0,homeName:"LOCAL",awayName:"VISITANTE",remaining:600,running:false,endAt:null};
function dots(n){return Array.from({length:6},(_,i)=>`<i class="dot ${i<n?"on":""}"></i>`).join("")}
function rem(){return state.running&&state.endAt?Math.max(0,Math.ceil((state.endAt-Date.now())/1000)):state.remaining}
function draw(){hn.textContent=state.homeName;an.textContent=state.awayName;hs.textContent=state.home;as.textContent=state.away;hf.innerHTML=dots(state.homeF);af.innerHTML=dots(state.awayF);let t=rem();cl.textContent=`${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`}
ref.on("value",s=>{state=s.val()||state;draw()});setInterval(draw,250);
</script></head><body><div class="board"><div class="top"><img src="../logo.png"></div><div class="scores"><div class="team"><div id="hn">LOCAL</div><div class="score" id="hs">0</div><div class="fouls" id="hf"></div></div><div class="clock" id="cl">10:00</div><div class="team"><div id="an">VISITANTE</div><div class="score" id="as">0</div><div class="fouls" id="af"></div></div></div></div></body></html>
